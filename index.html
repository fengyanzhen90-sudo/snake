<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贪吃蛇</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101418;
      --panel: #171d23;
      --panel-2: #202833;
      --text: #eef3f7;
      --muted: #aab6c2;
      --accent: #4fd06f;
      --accent-2: #f5b84b;
      --danger: #ef5f5f;
      --grid: #26313c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 15%, rgba(79, 208, 111, 0.16), transparent 28rem),
        radial-gradient(circle at 85% 80%, rgba(245, 184, 75, 0.12), transparent 26rem),
        var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    main {
      width: min(94vw, 720px);
      padding: 18px;
    }

    .shell {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(23, 29, 35, 0.92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.32);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 42px);
      line-height: 1;
      letter-spacing: 0;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat {
      min-width: 92px;
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      font-size: 22px;
    }

    .board-wrap {
      position: relative;
      aspect-ratio: 1;
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      background: #121820;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(16, 20, 24, 0.72);
      text-align: center;
    }

    .overlay[hidden] {
      display: none;
    }

    .message {
      max-width: 420px;
    }

    .message h2 {
      margin: 0 0 10px;
      font-size: clamp(28px, 7vw, 54px);
      letter-spacing: 0;
    }

    .message p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      color: #0c1210;
      background: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .pad {
      display: none;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(2, 48px);
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }

    .pad button {
      padding: 0;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 22px;
    }

    .pad .up {
      grid-column: 2;
    }

    .pad .left {
      grid-column: 1;
      grid-row: 2;
    }

    .pad .down {
      grid-column: 2;
      grid-row: 2;
    }

    .pad .right {
      grid-column: 3;
      grid-row: 2;
    }

    @media (max-width: 560px) {
      main {
        padding: 10px;
      }

      .shell {
        padding: 12px;
      }

      .stats {
        width: 100%;
      }

      .stat {
        flex: 1;
        min-width: 0;
      }

      .controls {
        justify-content: center;
      }

      .hint {
        width: 100%;
        text-align: center;
      }

      .pad {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-label="贪吃蛇游戏">
      <header>
        <h1>贪吃蛇</h1>
        <div class="stats" aria-live="polite">
          <div class="stat">
            <span>分数</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>最高分</span>
            <strong id="best">0</strong>
          </div>
          <div class="stat">
            <span>速度</span>
            <strong id="speed">1</strong>
          </div>
        </div>
      </header>

      <div class="board-wrap">
        <canvas id="game" width="600" height="600" aria-label="游戏区域"></canvas>
        <div class="overlay" id="overlay">
          <div class="message">
            <h2 id="title">准备开始</h2>
            <p id="subtitle">按方向键或 WASD 移动，吃到食物会变长。撞墙或撞到自己就结束。</p>
            <button id="start">开始游戏</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="secondary" id="pause">暂停</button>
        <button class="secondary" id="restart">重新开始</button>
        <p class="hint">空格暂停，Enter 开始。手机可滑动或使用方向按钮。</p>
      </div>

      <div class="pad" aria-label="触屏方向键">
        <button class="up" data-dir="up" aria-label="向上">▲</button>
        <button class="left" data-dir="left" aria-label="向左">◀</button>
        <button class="down" data-dir="down" aria-label="向下">▼</button>
        <button class="right" data-dir="right" aria-label="向右">▶</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.querySelector("#score");
    const bestEl = document.querySelector("#best");
    const speedEl = document.querySelector("#speed");
    const overlay = document.querySelector("#overlay");
    const titleEl = document.querySelector("#title");
    const subtitleEl = document.querySelector("#subtitle");
    const startBtn = document.querySelector("#start");
    const pauseBtn = document.querySelector("#pause");
    const restartBtn = document.querySelector("#restart");

    const cells = 24;
    const cellSize = canvas.width / cells;
    const startSnake = [
      { x: 10, y: 12 },
      { x: 9, y: 12 },
      { x: 8, y: 12 }
    ];

    const dirs = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let best = Number(localStorage.getItem("snake-best") || 0);
    let running;
    let paused;
    let gameOver;
    let timer;
    let touchStart = null;

    bestEl.textContent = best;

    function reset() {
      snake = startSnake.map(part => ({ ...part }));
      direction = dirs.right;
      nextDirection = dirs.right;
      score = 0;
      running = false;
      paused = false;
      gameOver = false;
      scoreEl.textContent = score;
      speedEl.textContent = "1";
      pauseBtn.textContent = "暂停";
      placeFood();
      draw();
      showOverlay("准备开始", "按方向键或 WASD 移动，吃到食物会变长。撞墙或撞到自己就结束。", "开始游戏");
    }

    function start() {
      if (gameOver) {
        reset();
      }
      running = true;
      paused = false;
      overlay.hidden = true;
      pauseBtn.textContent = "暂停";
      scheduleTick();
    }

    function pauseToggle() {
      if (!running || gameOver) return;
      paused = !paused;
      pauseBtn.textContent = paused ? "继续" : "暂停";
      if (paused) {
        clearTimeout(timer);
        showOverlay("已暂停", "按空格或点击继续回到游戏。", "继续");
      } else {
        overlay.hidden = true;
        scheduleTick();
      }
    }

    function scheduleTick() {
      clearTimeout(timer);
      if (!running || paused || gameOver) return;
      timer = setTimeout(() => {
        update();
        draw();
        scheduleTick();
      }, tickDelay());
    }

    function tickDelay() {
      return Math.max(72, 150 - Math.floor(score / 5) * 9);
    }

    function update() {
      direction = nextDirection;
      const head = snake[0];
      const next = {
        x: head.x + direction.x,
        y: head.y + direction.y
      };

      if (hitWall(next) || hitSnake(next)) {
        endGame();
        return;
      }

      snake.unshift(next);

      if (next.x === food.x && next.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        speedEl.textContent = String(Math.floor(score / 50) + 1);
        placeFood();
      } else {
        snake.pop();
      }
    }

    function hitWall(part) {
      return part.x < 0 || part.x >= cells || part.y < 0 || part.y >= cells;
    }

    function hitSnake(part) {
      return snake.some(segment => segment.x === part.x && segment.y === part.y);
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * cells),
          y: Math.floor(Math.random() * cells)
        };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function endGame() {
      running = false;
      gameOver = true;
      clearTimeout(timer);
      if (score > best) {
        best = score;
        localStorage.setItem("snake-best", String(best));
        bestEl.textContent = best;
      }
      showOverlay("游戏结束", `本局得分 ${score}。再来一局，把这条蛇养得更离谱一点。`, "再来一局");
    }

    function showOverlay(title, subtitle, buttonText) {
      titleEl.textContent = title;
      subtitleEl.textContent = subtitle;
      startBtn.textContent = buttonText;
      overlay.hidden = false;
    }

    function changeDirection(name) {
      const wanted = dirs[name];
      if (!wanted) return;
      const reversing = wanted.x + direction.x === 0 && wanted.y + direction.y === 0;
      if (!reversing) {
        nextDirection = wanted;
      }
      if (!running && !gameOver) {
        start();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBoard();
      drawFood();
      drawSnake();
    }

    function drawBoard() {
      ctx.fillStyle = "#121820";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--grid");
      ctx.lineWidth = 1;
      for (let i = 1; i < cells; i++) {
        const pos = i * cellSize;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, canvas.height);
        ctx.moveTo(0, pos);
        ctx.lineTo(canvas.width, pos);
        ctx.stroke();
      }
    }

    function drawFood() {
      const pad = cellSize * 0.18;
      ctx.fillStyle = "#f5b84b";
      ctx.beginPath();
      ctx.roundRect(food.x * cellSize + pad, food.y * cellSize + pad, cellSize - pad * 2, cellSize - pad * 2, 8);
      ctx.fill();
    }

    function drawSnake() {
      snake.forEach((part, index) => {
        const pad = index === 0 ? cellSize * 0.1 : cellSize * 0.15;
        ctx.fillStyle = index === 0 ? "#65e782" : "#3fc963";
        ctx.beginPath();
        ctx.roundRect(part.x * cellSize + pad, part.y * cellSize + pad, cellSize - pad * 2, cellSize - pad * 2, 7);
        ctx.fill();

        if (index === 0) {
          ctx.fillStyle = "#0c1210";
          const eyeSize = cellSize * 0.1;
          const eyeOffset = cellSize * 0.22;
          ctx.beginPath();
          ctx.arc(part.x * cellSize + eyeOffset, part.y * cellSize + eyeOffset, eyeSize, 0, Math.PI * 2);
          ctx.arc(part.x * cellSize + cellSize - eyeOffset, part.y * cellSize + eyeOffset, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    document.addEventListener("keydown", event => {
      const keyMap = {
        ArrowUp: "up",
        w: "up",
        W: "up",
        ArrowDown: "down",
        s: "down",
        S: "down",
        ArrowLeft: "left",
        a: "left",
        A: "left",
        ArrowRight: "right",
        d: "right",
        D: "right"
      };

      if (keyMap[event.key]) {
        event.preventDefault();
        changeDirection(keyMap[event.key]);
      } else if (event.key === " ") {
        event.preventDefault();
        pauseToggle();
      } else if (event.key === "Enter") {
        start();
      }
    });

    document.querySelectorAll("[data-dir]").forEach(button => {
      button.addEventListener("click", () => changeDirection(button.dataset.dir));
    });

    canvas.addEventListener("touchstart", event => {
      const touch = event.changedTouches[0];
      touchStart = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });

    canvas.addEventListener("touchend", event => {
      if (!touchStart) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.x;
      const dy = touch.clientY - touchStart.y;
      touchStart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      changeDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    }, { passive: true });

    startBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", pauseToggle);
    restartBtn.addEventListener("click", () => {
      reset();
      start();
    });

    reset();
  </script>
</body>
</html>
